<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Till{% endblock %}</title>
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #ddd4c4;
      --card: #fffdf8;
      --green: #0c6a43;
      --green-bg: #e5f4ec;
      --red: #8d2c2c;
      --red-bg: #f8e7e3;
      --amber: #7a4e0d;
      --amber-bg: #f8efd4;
      --blue: #1d4e7a;
      --blue-bg: #e6eef6;
      --focus: #0c6a43;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 "Avenir Next", "Segoe UI", sans-serif;
    }
    a { color: var(--green); }
    a:hover { color: var(--ink); }
    .skip {
      position: absolute;
      left: 8px;
      top: -40px;
      background: var(--ink);
      color: white;
      padding: 8px 12px;
    }
    .skip:focus { top: 8px; }
    header.bar {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .brand {
      font-family: Palatino, "Iowan Old Style", Georgia, serif;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-decoration: none;
    }
    nav { display: flex; gap: 16px; }
    nav a { color: var(--muted); text-decoration: none; padding: 8px 2px; border-bottom: 2px solid transparent; }
    nav a:hover { text-decoration: underline; }
    nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--green); font-weight: 600; }
    .spacer { flex: 1; }
    .who { color: var(--muted); font-size: 14px; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
    h1, h2, h3 {
      font-family: Palatino, "Iowan Old Style", Georgia, serif;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; }
    h2 { font-size: 22px; margin: 28px 0 8px; }
    h3 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .lede { color: var(--muted); max-width: 62ch; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; margin: 0 0 6px; text-transform: uppercase; }
    .page-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 24px; }
    .page-head h1 { margin-bottom: 8px; }
    .page-head .lede { margin: 0; }
    .banner, .alert {
      border: 1px solid var(--line);
      background: var(--blue-bg);
      color: var(--blue);
      padding: 12px 14px;
      margin: 16px 0;
    }
    .alert.error { background: var(--red-bg); color: var(--red); border-color: #e3c4be; }
    .alert.ok { background: var(--green-bg); color: var(--green); border-color: #c9e4d4; }
    .alert { border-radius: 8px; }
    .chat-shell { max-width: 760px; margin: 22px auto; }
    .chat-thread { display: grid; gap: 14px; margin-bottom: 18px; }
    .chat-message { max-width: 88%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .chat-message.assistant { border-bottom-left-radius: 4px; }
    .chat-message.shopper { justify-self: end; border-bottom-right-radius: 4px; background: var(--blue-bg); border-color: #cbd9e7; }
    .chat-message p:last-child { margin-bottom: 0; }
    .chat-compose { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 16px; }
    .chat-compose label { font-weight: 700; margin-top: 0; }
    .chat-compose textarea { display: block; width: 100%; max-width: none; min-height: 112px; border-radius: 8px; }
    .limits-card { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 18px; }
    .limits-card h2 { margin: 0 0 6px; }
    .limits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .limits-grid input { border-radius: 6px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 28px 0 10px; }
    .section-head h2 { margin: 0; }
    .count { color: var(--muted); font-size: 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    .table-wrap table { min-width: 760px; }
    tbody tr:hover { background: #f6f2ea; }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    td a { color: var(--ink); font-weight: 600; }
    .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-align: right; }
    th.num { text-align: right; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .badge.malicious { background: var(--red-bg); color: var(--red); }
    .badge.bad { background: var(--red-bg); color: var(--red); }
    .badge.policy { background: var(--amber-bg); color: var(--amber); }
    .badge.ok { background: var(--green-bg); color: var(--green); }
    .badge.wait { background: var(--blue-bg); color: var(--blue); }
    .badge.neutral { background: #eeeae2; color: var(--muted); }
    .views {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .view, .card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 14px;
      min-width: 0;
    }
    .view h3 {
      color: var(--muted);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    dl { margin: 0; }
    .view dt { color: var(--muted); font-size: 13px; }
    .view dd { margin: 0 0 8px; overflow-wrap: anywhere; }
    .decision-grid { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 12px; margin: 24px 0; }
    .decision-grid .card { border-radius: 8px; }
    .decision-grid .card h2 { margin: 0 0 10px; }
    .decision-grid .card p:last-child { margin-bottom: 0; }
    .decision-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
    .action-panel { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 16px; margin: 18px 0 28px; }
    .action-panel h2 { margin: 0 0 6px; }
    .action-panel p { color: var(--muted); }
    .action-panel .actions { margin-top: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button, .button {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--green); border-color: var(--green); color: white; }
    a.button { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: var(--green); border-color: var(--green); color: white; font-weight: 600; }
    a.button:hover, button.primary:hover { background: #084f33; border-color: #084f33; }
    .button.secondary { background: transparent; color: var(--ink); }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    label { display: block; font-size: 14px; margin: 14px 0 4px; }
    input, textarea {
      width: 100%;
      max-width: 460px;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: white;
      font: inherit;
      color: var(--ink);
    }
    textarea { min-height: 88px; }
    form.stack { max-width: 520px; }
    .field { margin: 18px 0; }
    .field label { margin: 0 0 5px; font-weight: 600; }
    .field-help { display: block; max-width: 62ch; margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .rule-summary { max-width: 720px; margin-top: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 14px 16px; }
    .rule-summary summary { cursor: pointer; font-weight: 600; }
    .rule-summary[open] summary { margin-bottom: 14px; }
    .merchant-list { display: grid; gap: 8px; margin: 12px 0; }
    .merchant-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    .merchant-row form { margin: 0; }
    .text-button { min-height: 36px; padding: 0 10px; border-color: transparent; color: var(--red); text-decoration: underline; }
    ol.timeline { padding-left: 18px; }
    ol.timeline li { margin: 6px 0; }
    .crumbs { color: var(--muted); font-size: 14px; }
    .empty { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 28px; }
    .empty h2 { margin: 0 0 8px; }
    .empty .actions { margin-top: 16px; }
    .audit-details { margin: 24px 0; border-top: 1px solid var(--line); padding-top: 14px; }
    .audit-details summary { cursor: pointer; font-weight: 600; }
    .audit-details[open] summary { margin-bottom: 12px; }
    @media (max-width: 900px) {
      .views { grid-template-columns: 1fr 1fr; }
      .decision-grid { grid-template-columns: 1fr 1fr; }
      h1 { font-size: 32px; }
    }
    @media (max-width: 640px) {
      .views { grid-template-columns: 1fr; }
      .decision-grid { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; align-items: start; }
      .chat-shell { margin: 16px 0; }
      .chat-message { max-width: 94%; }
      .limits-grid { grid-template-columns: 1fr; }
      header.bar { flex-wrap: wrap; padding: 12px 16px; }
      main { padding: 24px 16px 48px; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="bar">
    <a class="brand" href="/orders">Till</a>
    {% if signed_in %}
    <nav>
      <a href="/orders" {% if request.url.path.startswith('/orders') %}aria-current="page"{% endif %}>Orders</a>
      <a href="/policy" {% if request.url.path == '/policy' %}aria-current="page"{% endif %}>Shopping</a>
    </nav>
    <div class="spacer"></div>
    <span class="who">{{ email }}</span>
    <form method="post" action="/logout">
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main id="content">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
